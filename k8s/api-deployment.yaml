apiVersion: v1
kind: ConfigMap
metadata:
  name: xpand-config
  namespace: default
data:
  API_ENVIRONMENT: "production"
  API_LOG_LEVEL: "info"
  API_WORKERS: "4"
  MAX_BATCH_SIZE: "10000"
  CACHE_TTL: "3600"
  ENABLE_SHAP_EXPLANATION: "true"
  ENABLE_BIP_OPTIMIZER: "true"

---
apiVersion: v1
kind: Secret
metadata:
  name: xpand-secrets
  namespace: default
type: Opaque
data:
  SECRET_KEY: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24K  # base64 encoded
  SENTRY_DSN: ""  # Add your Sentry DSN

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xpand-api
  namespace: default
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: xpand-api
  template:
    metadata:
      labels:
        app: xpand-api
        version: "1.0"
    spec:
      serviceAccountName: xpand-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: api
        image: xpand:1.0.0
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: xpand-config
        - secretRef:
            name: xpand-secrets
        
        env:
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        volumeMounts:
        - name: data
          mountPath: /app/data
          readOnly: true
        - name: models
          mountPath: /app/models
          readOnly: true
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: data
        emptyDir: {}
      - name: models
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - xpand-api
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: xpand-api
  namespace: default
  labels:
    app: xpand-api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: xpand-api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xpand-api-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xpand-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: xpand-api-pdb
  namespace: default
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: xpand-api

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xpand-sa
  namespace: default

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: xpand-api-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: xpand-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: xpand-frontend
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: xpand-frontend
    ports:
    - protocol: TCP
      port: 3000
